# Shared config for every environment. Profile files (application-{profile}.yaml) override these values.
spring:
  application:
    name: running-wrapped
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only checks that entities match it, and startup fails if not.
      ddl-auto: validate
    # Don't keep the DB session open while the HTTP response renders. Services must load what they need.
    open-in-view: false
